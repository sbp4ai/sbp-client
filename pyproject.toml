[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbp-client"
version = "0.4.0"
description = "SBP (Session Bridge Protocol) E2EE crypto core: X25519 crypto_box + Ed25519, opaque-tag routing, for clients and devices talking to an untrusted sbp-dispatcher."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "slamKun" }]
keywords = ["sbp", "e2ee", "encryption", "x25519", "ed25519", "session-bridge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pynacl>=1.5",
    "argon2-cffi>=21.0",
]

[project.urls]
Homepage = "https://github.com/sbp4ai/sbp-spec"
Specification = "https://github.com/sbp4ai/sbp-spec/blob/main/spec/SBP-0.4-e2ee.md"

[tool.setuptools]
packages = ["sbp_client"]
